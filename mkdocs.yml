# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Raspberry Pi Environmental Monitoring: Grades 6–12'
site_description: 'A hands-on textbook for middle and high school students: build a Raspberry Pi station that measures temperature, pressure, and humidity, logs the data, and reports it from the field.'
site_author: 'Hank R.'
site_url: 'https://iowerx.github.io/pi-env-monitor/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` sets og:image and twitter:image to
# `site_url + <image>` for any page declaring `image:` in its frontmatter.
# Pages without `image:` are untouched. It does NOT emit og:title,
# og:description, og:type, og:url, or twitter:card — crawlers fall back to
# the page <title> and <meta name="description"> for those. Enable the
# `social` plugin below (needs Cairo) if you want full per-page cards.
# Verify the image tags with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/iowerx/pi-env-monitor'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Hank R. Licensed under <a href="licensing/">CC BY-NC-SA 4.0</a> for non-commercial use.'

